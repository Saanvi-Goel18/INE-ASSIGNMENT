services:
  - type: web
    name: price-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: HEADLESS
        value: "true"
